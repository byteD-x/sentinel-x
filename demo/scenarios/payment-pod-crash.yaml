name: "payment-pod-crash@1"
version: 1
description: "payment-api 单个工作负载实例短暂不可用，由 Deployment 自动补齐。"
category: kubernetes
faults:
  - fault_type: pod_crash
    target_service: payment-api
    target_namespace: demo-shop
    parameters:
      replicas_before: 2
    duration_seconds: 120
    cleanup_command: "scenario_runner:confirm_pod_replaced"
ground_truth: "WORKLOAD_UNAVAILABLE + payment-api"
expected_root_cause_category: WORKLOAD_UNAVAILABLE
expected_evidence:
  - "payment-api ready 副本短暂下降"
  - "payment-api 5xx 与 payment span error"
recovery_assertions:
  - "payment-api Ready 副本恢复"
  - "payment-api 5xx 错误率低于场景阈值"
allowlisted_runbooks:
  - "no_op"
