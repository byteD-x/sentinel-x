name: "order-bad-deployment@1"
version: 1
description: "order-api 错误部署导致持续失败，需人工判断回滚"
category: application
faults:
  - fault_type: error_5xx
    target_service: order-api
    parameters:
      error_rate: 0.9
    duration_seconds: 600
    cleanup_command: "POST /fault/clear"
ground_truth: "order-api 最新部署引入了配置错误，需要回滚到上一版本（R2 动作，MVP 需升级人工）"
expected_root_cause_category: application
recovery_assertions:
  - "order-api 已回滚到稳定版本"
allowlisted_runbooks:
  - "db_rollback@1"  # R2 — MVP 中应被拒绝，升级人工
