name: "payment-latency@1"
version: 1
description: "inventory-api 网络延迟导致 payment-api 响应时间飙升"
category: network
faults:
  - fault_type: latency
    target_service: inventory-api
    parameters:
      latency_ms: 3000
    duration_seconds: 300
    cleanup_command: "POST /fault/clear"
ground_truth: "inventory-api 服务在 15:31-15:33 期间出现网络延迟，导致 payment-api 调用超时"
expected_root_cause_category: network
expected_evidence:
  - "Prometheus: payment-api p99 延迟上升"
  - "Loki: inventory-api 连接超时日志"
  - "Tempo: payment→inventory span 延迟异常"
recovery_assertions:
  - "payment-api p99 延迟 < 500ms"
  - "inventory-api 恢复可连接"
allowlisted_runbooks:
  - "restart_deployment@1"
