name: "order-db-errors@1"
version: 1
description: "order-api 数据库连接池耗尽导致 5xx 错误率飙升"
category: database
faults:
  - fault_type: error_5xx
    target_service: order-api
    parameters:
      error_rate: 0.5
    duration_seconds: 300
    cleanup_command: "POST /fault/clear"
ground_truth: "order-api 与数据库的连接池耗尽，所有需要数据库查询的请求返回 5xx"
expected_root_cause_category: database
recovery_assertions:
  - "order-api 5xx 错误率 < 1%"
allowlisted_runbooks:
  - "restart_deployment@1"
