[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-x-control-api"
version = "0.1.0"
description = "Sentinel-X Control API — HTTP/SSE interface"
requires-python = ">=3.13"
dependencies = [
    "sentinel-x-domain>=0.1",
    "sentinel-x-contracts>=0.1",
    "sentinel-x-policy>=0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]
