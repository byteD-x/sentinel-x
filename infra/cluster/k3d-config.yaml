# k3d 集群配置 — 本地开发环境
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: sentinel-x-local
servers: 1
agents: 2
kubeAPI:
  host: "127.0.0.1"
  hostPort: "6443"
image: rancher/k3s:v1.31.5-k3s1
network: sentinel-x-net
volumes:
  - volume: /tmp/sentinel-x/data:/data
    nodeFilters:
      - server:0
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  kubeconfig:
    switchCurrentContext: true
    updateDefaultKubeconfig: true
