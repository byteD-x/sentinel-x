              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  namespace: demo-shop
spec:
  selector:
    app: inventory-api
  ports:
    - port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
