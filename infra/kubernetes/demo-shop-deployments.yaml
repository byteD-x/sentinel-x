---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: demo-shop
  labels:
    app: order-api
    app.kubernetes.io/part-of: sentinel-x
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
        - name: order-api
          image: sentinel-x/order-api:latest
          ports:
            - containerPort: 8082
          env:
            - name: INVENTORY_URL
              value: "http://inventory-api.demo-shop.svc.cluster.local:8083"
            - name: PAYMENT_URL
              value: "http://payment-api.demo-shop.svc.cluster.local:8084"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: demo-shop
spec:
  selector:
    app: order-api
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: demo-shop
  labels:
    app: inventory-api
spec:
  replicas: 2
