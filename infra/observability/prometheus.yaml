# Prometheus 配置 — 抓取 demo-shop 服务指标
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'demo-shop-services'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [demo-shop]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: '(order-api|inventory-api|payment-api)'
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: '808[2-4]'

  - job_name: 'sentinel-system'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [sentinel-system]

rule_files:
  - '/etc/prometheus/rules/alert-rules.yaml'
