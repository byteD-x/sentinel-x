# Alertmanager 配置
global:
  resolve_timeout: 5m

route:
  receiver: 'sentinel-webhook'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'sentinel-webhook'
      group_wait: 10s

receivers:
  - name: 'sentinel-webhook'
    webhook_configs:
      - url: 'http://control-api.sentinel-system.svc.cluster.local:8000/api/v1/webhooks/alertmanager'
        send_resolved: true
