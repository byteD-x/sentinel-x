# Prometheus 告警规则
groups:
  - name: sentinel-demo-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} 5xx 错误率 > 5%"
          description: "{{ $labels.service }} 在过去 5 分钟的 5xx 错误率为 {{ $value | humanizePercentage }}"

      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} p99 延迟 > 2s"
          description: "{{ $labels.service }} p99 延迟为 {{ $value }}s"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} 服务不可达"
