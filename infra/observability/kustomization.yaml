apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yaml
      - alert-rules.yaml
  - name: loki-config
    files:
      - loki.yaml
  - name: tempo-config
    files:
      - tempo.yaml
  - name: otel-collector-config
    files:
      - otel-collector.yaml
resources:
  - stack.yaml
