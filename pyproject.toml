[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-x"
version = "0.0.0"
description = "AI 事故指挥中心：在隔离演练环境中演示 AI 辅助故障诊断与受控恢复"
readme = "README.md"
license = { text = "UNLICENSED" }
requires-python = ">=3.13"
authors = [
    { name = "Sentinel-X Team" }
]
keywords = [
    "incident-response",
    "ai-ops",
    "temporal",
    "observability",
    "kubernetes",
    "demonstration",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]

# Root metadata is intentionally small; package-specific dependencies live under apps/ and packages/.

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = [
    "packages/domain/tests",
    "packages/diagnostics/tests",
    "apps/control-api/tests",
    "apps/action-gateway/tests",
    "apps/incident-worker/tests",
    "demo/services/tests",
    "evals/tests",
]
addopts = "--import-mode=importlib --asyncio-mode=auto"
pythonpath = [
    "packages/contracts/src",
    "packages/domain/src",
    "packages/policy/src",
    "packages/diagnostics/src",
    "apps/control-api/src",
    "apps/action-gateway/src",
    "apps/incident-worker/src",
    "demo/services/src",
    "evals/src",
]
